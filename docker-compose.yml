services:
  connect:
    image: ghcr.io/posit-dev/connect:2026.11.1-ubuntu-24.04-std
    platform: linux/amd64
    privileged: true
    ports:
      - "3939:3939"
    # Install optional CA certs (./certs), create the bootstrap secret (see
    # [Bootstrap] in rstudio-connect.gcfg) once, then hand over to the image's
    # normal startup script.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        bash /usr/local/bin/install-ca-certs.sh
        key=/var/lib/connect-bootstrap/bootstrap.key
        if [ ! -s "$$key" ]; then (umask 077; openssl rand -base64 32 > "$$key"); fi
        exec /usr/local/bin/startup.sh
    environment:
      # Content inherits these (Applications.InheritSystemEnvVars defaults to true),
      # so Python requests and Node.js trust ./certs too.
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./licenses/connect-license.lic:/etc/rstudio-connect/license.lic:ro
      - ./config/connect/rstudio-connect.gcfg:/etc/rstudio-connect/rstudio-connect.gcfg:ro
      - ./config/shared/install-ca-certs.sh:/usr/local/bin/install-ca-certs.sh:ro
      - ./certs:/etc/posit-team/ca-certs:ro
      - connect-data:/var/lib/rstudio-connect
      - connect-bootstrap:/var/lib/connect-bootstrap
    depends_on:
      - package-manager
    restart: unless-stopped

  # One-shot: bootstraps an admin, then creates/updates the SAS Viya (Viewer)
  # OAuth integration. Re-run with: docker compose run --rm connect-init
  connect-init:
    image: ghcr.io/posit-dev/connect:2026.11.1-ubuntu-24.04-std
    platform: linux/amd64
    entrypoint: ["/usr/bin/python3", "-I", "/usr/local/bin/connect-init.py"]
    environment:
      CONNECT_URL: http://connect:3939
      CONNECT_INIT_API_KEY: ${CONNECT_INIT_API_KEY:-}
      CONNECT_ADMIN_USER: ${CONNECT_ADMIN_USER:-admin}
      CONNECT_ADMIN_PASSWORD: ${CONNECT_ADMIN_PASSWORD:-}
      # Publisher with the same login as the Workbench user (PWB_TESTUSER).
      # Connect rejects weak passwords such as "posit", hence the longer default.
      CONNECT_PUBLISHER_USER: posit
      CONNECT_PUBLISHER_PASSWORD: ${POSIT_USER_PASSWORD:-positsas2026}
      VIYA_HOSTNAME: ${VIYA_HOSTNAME:-}
      VIYA_SCOPES: ${VIYA_SCOPES:-}
      CONNECT_VIYA_CLIENT_ID: ${CONNECT_VIYA_CLIENT_ID:-}
      CONNECT_VIYA_CLIENT_SECRET: ${CONNECT_VIYA_CLIENT_SECRET:-}
    volumes:
      - ./config/connect/connect-init.py:/usr/local/bin/connect-init.py:ro
      - connect-bootstrap:/var/lib/connect-bootstrap
    depends_on:
      connect:
        condition: service_healthy
    restart: "no"

  package-manager:
    image: ghcr.io/posit-dev/package-manager:2026.11.0-ubuntu-24.04-std
    platform: linux/amd64
    ports:
      - "4242:4242"
    volumes:
      - ./licenses/package-manager-license.lic:/etc/rstudio-pm/license.lic:ro
      - ./config/ppm/rstudio-pm.gcfg:/etc/rstudio-pm/rstudio-pm.gcfg:ro
      - package-manager-data:/var/lib/rstudio-pm
    restart: unless-stopped

  workbench:
    image: ghcr.io/posit-dev/workbench:2026.11.0-203.pro4-ubuntu-24.04-std
    platform: linux/amd64
    ports:
      - "8787:8787"
    # pwb-init.sh writes oauth-clients.conf, then execs the image's entrypoint.
    # Overriding entrypoint clears the image CMD, so it is restated here.
    entrypoint: ["/bin/bash", "/usr/local/bin/pwb-init.sh"]
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/supervisord.conf"]
    environment:
      PWB_TESTUSER: posit
      PWB_TESTUSER_PASSWD: ${POSIT_USER_PASSWORD:-positsas2026}
      # Needed for restarts: the image's startup.sh only skips `useradd` for an
      # existing user when it can look it up by this UID.
      PWB_TESTUSER_UID: "10000"
      # SAS Viya OAuth (from your shell or ./.env); leave all unset to disable.
      VIYA_HOSTNAME: ${VIYA_HOSTNAME:-}
      WORKBENCH_VIYA_CLIENT_ID: ${WORKBENCH_VIYA_CLIENT_ID:-}
      WORKBENCH_VIYA_CLIENT_SECRET: ${WORKBENCH_VIYA_CLIENT_SECRET:-}
      # Default Positron SAS connection profile (created when VIYA_HOSTNAME is set).
      POSITRON_SAS_CLIENT_ID: ${POSITRON_SAS_CLIENT_ID:-}
      POSITRON_SAS_CLIENT_SECRET: ${POSITRON_SAS_CLIENT_SECRET:-}
    volumes:
      - ./licenses/workbench-license.lic:/etc/rstudio-server/license.lic:ro
      - ./config/workbench/pwb-init.sh:/usr/local/bin/pwb-init.sh:ro
      - ./config/shared/install-ca-certs.sh:/usr/local/bin/install-ca-certs.sh:ro
      - ./certs:/etc/posit-team/ca-certs:ro
      # Mount individual files: the image ships ~25 other files in /etc/rstudio
      # (launcher config, r-versions, Positron/VS Code settings) that must stay.
      - ./config/workbench/repos.conf:/etc/rstudio/repos.conf:ro
      - ./config/workbench/rsession.conf:/etc/rstudio/rsession.conf:ro
      # Image default plus REQUESTS_CA_BUNDLE/NODE_EXTRA_CA_CERTS for sessions.
      - ./config/workbench/launcher-env:/etc/rstudio/launcher-env:ro
      # Image default plus the Positron SAS extension.
      - ./config/workbench/positron.extensions.conf:/etc/rstudio/positron.extensions.conf:ro
      - ./config/workbench/pip.conf:/etc/pip.conf:ro
      - workbench-home:/home
      - workbench-shared:/var/lib/rstudio-server
    depends_on:
      - package-manager
      - connect
    restart: unless-stopped

volumes:
  connect-data:
  connect-bootstrap:
  package-manager-data:
  workbench-home:
  workbench-shared:
