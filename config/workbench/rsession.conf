# Posit Workbench R session configuration
# https://docs.posit.co/ide/server-pro/admin/reference/rsession_conf.html

session-timeout-minutes=480
session-timeout-kill-hours=0

# Pre-configure the Connect server for publishing. Sessions run inside the
# workbench container, so use the compose service name. The browser-side
# token-claim link uses Connect's own Server.Address (http://localhost:3939).
default-rsconnect-server=http://connect:3939
